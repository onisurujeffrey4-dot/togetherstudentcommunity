<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<title>Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;--g:#102A43;--gd:#0c2035;--lime:#2F6F68;--y:#2F6F68;--c:#F2A36B;--cream:#F7F5EF;--ink:#102A43;--mut:#5b6b7a;--line:#e2dfd4;--err:#c2410c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:16px/1.5 Manrope,system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-text-size-adjust:100%}
h1,h2,h3,.hd{font-family:Manrope,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
button,input,select{font:inherit}
.split{min-height:100dvh;display:grid;grid-template-columns:1fr}
.brand{background:var(--g);color:#fff;padding:28px 24px 34px;position:relative;overflow:hidden}
.brand:before{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;background:var(--lime);opacity:.3}
.brand:after{content:none}
.brand>*{position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px;font:800 26px Manrope;color:inherit}
.brand h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:22px 0 10px;font-weight:800}
.brand h1 em{font-style:normal;color:var(--lime)}
.brand .lead{display:none}
.perks{list-style:none;padding:0;margin:20px 0 0;display:none;gap:10px}
.perks li{display:flex;gap:12px;align-items:center;font-weight:500}
.perks i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:16px}
.main{padding:22px 18px 40px;display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:440px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{font-size:26px;font-weight:800;margin-bottom:6px}
.sub{color:var(--mut);margin:0 0 20px}
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.inp{position:relative}
input,select{width:100%;height:50px;padding:0 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:16px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 4px rgba(47,111,104,.28)}
.bad input,.bad select{border-color:var(--err)}
.msg{color:var(--err);font-size:13px;min-height:0;margin-top:4px;font-weight:500}
.eye{position:absolute;right:6px;top:6px;height:38px;padding:0 10px;border:0;background:none;color:var(--g);font-weight:600;border-radius:10px;cursor:pointer}
.row{display:grid;gap:0 12px}
.btn{width:100%;height:52px;border:0;border-radius:16px;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,box-shadow .12s,opacity .15s}
.btn:active{transform:scale(.97)}
.pri{background:var(--y);color:#fff;box-shadow:0 3px 0 #1f524c}
.grn{background:var(--g);color:#fff}
.ghost{background:transparent;color:var(--g);border:2px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
a{color:var(--g);font-weight:600;cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px;font-weight:500}
.alert.e{background:#fff1ea;color:var(--err);border:1px solid #ffd2bd}
.alert.ok{background:#e4ede9;color:var(--gd);border:1px solid #c5d9d3}
.foot{text-align:center;margin-top:18px;color:var(--mut);font-size:15px}
.big{font-size:54px;text-align:center;margin-bottom:8px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.sum{background:#fff;border:2px solid var(--line);border-radius:18px;padding:6px 16px;margin:16px 0 20px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}.sum span{color:var(--mut)}.sum b{text-align:right}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
/* app shell */
.top{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:600;cursor:pointer}
.page{max-width:900px;margin:0 auto;padding:22px 16px 110px}
.chips{display:flex;gap:10px;margin:14px 0 22px;flex-wrap:wrap}
.chip{border-radius:999px;padding:8px 16px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;color:var(--ink);font-weight:700;display:block;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--lime);text-decoration:none}.tile span{display:block;font-size:26px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav a{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:4px 10px;border-radius:12px;color:var(--mut)}
.nav a.on{color:var(--g);background:#e4ede9}.nav a span{font-size:20px}
.splash{min-height:100dvh;display:grid;place-items:center;background:var(--g);color:var(--lime)}
@media(min-width:860px){
.split{grid-template-columns:1.05fr 1fr}.brand{padding:56px;display:flex;flex-direction:column;justify-content:center}
.brand .lead,.perks{display:grid}.brand .lead{display:block;font-size:18px;max-width:460px;opacity:.92}
.main{align-items:center;padding:40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== LANDING ===== */
.L{background:var(--cream);color:var(--g);overflow-x:clip}.L h1,.L h2,.L h3,.L h4{font-weight:800;letter-spacing:-.03em;line-height:1.06;margin:0}
.L a{font-weight:inherit}.L section{scroll-margin-top:70px}
.Lnav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));transition:background .5s,box-shadow .5s}
.Lnav.sc{background:rgba(16,42,67,.94);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(16,42,67,.28)}
.Lnav .lg{display:flex;gap:10px;align-items:center;font-weight:800;font-size:21px;color:#fff;text-decoration:none}
.Lnav nav,.Lnav .r{display:none;gap:30px;align-items:center}.Lnav nav a{color:#ffffffcc;font-weight:500;cursor:pointer}.Lnav nav a:hover{color:#fff;text-decoration:none}.Lnav .r{gap:10px}
.lb{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 26px;border-radius:999px;font-weight:600;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s;text-decoration:none!important}
.lb.t{background:var(--lime);color:#fff}.lb.gh{color:#fff}.lb.ol{border:1.5px solid #ffffff55;color:#fff}.lb.nv{background:var(--g);color:#fff}.lb.ob{border:1.5px solid rgba(16,42,67,.3);color:var(--g)}
.bur{width:44px;height:44px;border:0;background:none;display:grid;place-content:center;gap:6px;cursor:pointer}.bur i{display:block;width:24px;height:2px;background:#fff;transition:transform .4s}
.bur.o i:first-child{transform:translateY(4px) rotate(45deg)}.bur.o i:last-child{transform:translateY(-4px) rotate(-45deg)}
.Lmenu{position:fixed;inset:0;z-index:15;background:var(--g);display:flex;flex-direction:column;justify-content:center;gap:22px;padding:24px 32px;clip-path:circle(0 at calc(100% - 40px) 36px);visibility:hidden;transition:clip-path .7s cubic-bezier(.7,0,.2,1),visibility 0s .7s}
.Lmenu.o{clip-path:circle(150% at calc(100% - 40px) 36px);visibility:visible;transition:clip-path .7s cubic-bezier(.7,0,.2,1),visibility 0s}
.Lmenu a{color:#fff;font-size:30px;font-weight:700;text-decoration:none}.Lmenu a.lb{font-size:17px;align-self:flex-start;margin-top:8px}
.hero{height:280vh;background:var(--g);position:relative}.stage{position:sticky;top:0;height:100dvh;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
.ht{position:relative;z-index:2;padding:96px 22px 0;max-width:680px}.ht h1{font-size:clamp(34px,9vw,74px);color:#fff}
.ht p{color:#ffffffc9;font-size:clamp(16px,2vw,19px);max-width:520px;margin:20px 0 28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}.cta.c{justify-content:center}
.hb{position:absolute;z-index:2;left:22px;right:22px;bottom:calc(26px + env(safe-area-inset-bottom,0px))}
.cap{color:#fff;font-size:clamp(17px,2.4vw,24px);font-weight:600;max-width:520px;margin:0 0 16px;opacity:0;transform:translateY(14px);transition:opacity 1s,transform 1s cubic-bezier(.2,.8,.2,1)}.cap.in{opacity:1;transform:none}
.pg{max-width:460px;margin-top:18px}.bars{display:flex;gap:6px}.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22);transition:background .8s}.bars i.on{background:#fff}
#pl{display:block;margin-top:10px;font-size:13px;font-weight:600;color:#ffffffb3}
.sec{max-width:1120px;margin:0 auto;padding:clamp(80px,13vw,150px) 22px}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1.1s cubic-bezier(.2,.8,.2,1) var(--d,0s),transform 1.1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}.rv.in{opacity:1;transform:none}
.big{font-size:clamp(38px,8.4vw,96px);font-weight:800;text-align:left}.sh{font-size:clamp(28px,4.6vw,48px);font-weight:600!important;max-width:760px}
.two{display:grid;gap:36px;margin-top:44px;align-items:center}.two p{font-size:clamp(18px,2.2vw,24px);line-height:1.55;margin:0;max-width:520px}
.net{width:100%;height:auto}.net path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.2s .3s ease}.net.in path{stroke-dashoffset:0}
.net circle{transform-box:fill-box;transform-origin:center;animation:pu 4s ease-in-out infinite alternate}@keyframes pu{to{transform:scale(1.18)}}
.pg4{display:grid;gap:16px;margin-top:44px}
.pc{background:var(--g) radial-gradient(120% 80% at 100% 0,rgba(47,111,104,.6),transparent 60%);color:#fff;border-radius:24px;padding:26px 22px 28px;min-height:230px;box-shadow:0 30px 40px -28px rgba(16,42,67,.65);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pc svg{opacity:.9}.pc h3{font-size:22px;margin:44px 0 8px;font-weight:700}.pc p{margin:0;color:#ffffffbd}
.jr{list-style:none;margin:48px 0 0;padding:0}
.stp{position:relative;padding:0 0 46px 62px;opacity:.3;transition:opacity 1s var(--d,0s)}.stp.in{opacity:1}
.stp .d{position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--cream);display:grid;place-items:center;font-weight:700;transition:background .8s var(--d,0s),color .8s var(--d,0s)}
.stp.in .d{background:var(--lime);border-color:var(--lime);color:#fff}
.stp:before,.stp:after{content:"";position:absolute;left:18px;top:44px;bottom:6px;width:2px;background:var(--line)}
.stp:after{background:var(--lime);transform:scaleY(0);transform-origin:top;transition:transform 1.2s var(--d,0s)}.stp.in:after{transform:scaleY(1)}
.stp:last-child:before,.stp:last-child:after{display:none}.stp h3{font-size:22px;margin-bottom:4px;font-weight:700}.stp p{margin:0;color:var(--mut)}
.cg{display:grid;gap:16px;margin-top:44px}
.cc{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 24px 40px -28px rgba(16,42,67,.45)}
.av{width:46px;height:46px;border-radius:50%;background:var(--lime);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.cc small,.uc small{display:block;color:var(--mut)}.cc b{display:block}
.ch{margin-left:auto;font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--cream);white-space:nowrap}.ch:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px}
.fl{}
.prod{background:#EFECE2}.prod .sec p{color:var(--mut);margin:14px 0 0;font-size:18px}
.pv{display:grid;gap:18px;perspective:1200px;margin-top:44px}
.uc{height:100%;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 28px 50px -26px rgba(16,42,67,.4);transform:rotateX(var(--rx,3deg)) rotateY(var(--ry,-4deg)) translateZ(var(--z,0px));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.uc.dk{background:var(--g);color:#fff}.uc.dk small{color:#ffffffb3}.uc h4{font-size:16px;font-weight:700;margin-bottom:14px}.uc b{font-size:22px;font-weight:800;display:block}
.uc ul{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:9px}.uc li{display:flex;gap:10px;align-items:center}.uc li:before{content:"";width:18px;height:18px;border-radius:6px;border:2px solid var(--line);flex:none}.uc li.k:before{background:var(--lime);border-color:var(--lime)}
.bar{height:6px;border-radius:6px;background:var(--line);margin-bottom:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--lime);transition:width 1.8s .4s cubic-bezier(.2,.8,.2,1)}.pv.in .bar i{width:66%}
.rgw{display:flex;align-items:center;gap:16px;margin-bottom:10px}.rgw svg{width:84px;flex:none}.rb,.rg{fill:none;stroke-width:7}.rb{stroke:var(--line)}.rg{stroke:var(--lime);stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:176;transition:stroke-dashoffset 2s .5s cubic-bezier(.2,.8,.2,1)}.pv.in .rg{stroke-dashoffset:44}
.avs{display:flex;margin-bottom:12px}.avs span{width:38px;height:38px;border-radius:50%;background:var(--lime);color:#fff;display:grid;place-items:center;font-weight:700;border:3px solid #fff;margin-right:-8px}.avs span:nth-child(2){background:var(--g)}
.emo{background:var(--g);color:#fff;min-height:82vh;display:grid;place-items:center;text-align:center;padding:120px 24px}.emo h2{font-size:clamp(34px,6.4vw,76px);max-width:960px;margin:0 auto}
.emo p{font-size:clamp(17px,2.2vw,24px);color:#ffffffb3;margin:36px 0 0}.ul{display:block;width:72px;height:3px;background:var(--c);border-radius:3px;margin:36px auto 0;transform:scaleX(0);transition:transform 1.6s .5s cubic-bezier(.2,.8,.2,1)}.ul.in{transform:scaleX(1)}
.fin{text-align:center;padding:clamp(90px,14vw,170px) 24px}.lock{display:inline-flex;align-items:center;gap:14px;font-size:34px;font-weight:800}.fin h2{font-size:clamp(34px,6vw,68px);margin:28px 0 34px}
.lf{padding:26px 24px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:center;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}.lf a{color:var(--mut);cursor:pointer;font-weight:500}
.hm{margin-top:4px;transition:opacity .8s}.cap:not(.in)~.hm{opacity:0;pointer-events:none}
@media(max-width:859px){.stp,.stp .d,.stp:after{--d:0s!important}}
@media(min-width:620px){.pg4{grid-template-columns:1fr 1fr}}
@media(min-width:860px){.ht h1{font-size:clamp(44px,4.4vw,64px)}.Lnav{padding:16px 48px}.Lnav nav,.Lnav .r{display:flex}.bur,.Lmenu{display:none}
.stage{display:grid;align-items:center}.ht{padding:0 48px 190px}.hb{left:48px;right:48px}.hm{display:none}
.two{grid-template-columns:1fr 1fr;gap:64px}.cg{grid-template-columns:repeat(3,1fr);gap:24px}.cg>.rv:nth-child(2){margin-top:64px}
.jr{display:grid;grid-template-columns:repeat(5,1fr)}.stp{padding:64px 22px 0 0}.stp:before,.stp:after{left:46px;right:6px;top:18px;bottom:auto;width:auto;height:2px}.stp:after{transform:scaleX(0);transform-origin:left}.stp.in:after{transform:scaleX(1)}
.pv{grid-template-columns:repeat(6,1fr)}.pv>div{grid-column:span 3}.pv>div:nth-child(1){grid-row:span 2}}
@media(min-width:1000px){.pg4{grid-template-columns:repeat(4,1fr)}}

/* ===== v2: cinematic story ===== */
.hw{display:inline-block;opacity:0;transform:translateY(22px);filter:blur(10px);transition:opacity 1.4s cubic-bezier(.2,.8,.2,1),transform 1.4s cubic-bezier(.2,.8,.2,1),filter 1.4s cubic-bezier(.2,.8,.2,1)}
.hw:nth-child(1){transition-delay:.5s}.hw:nth-child(2){transition-delay:.95s}.hw:nth-child(3){transition-delay:1.4s}
.ht p,.ht .cta{opacity:0;transform:translateY(14px);transition:opacity 1.3s cubic-bezier(.2,.8,.2,1),transform 1.3s cubic-bezier(.2,.8,.2,1)}.ht p{transition-delay:2s}.ht .cta{transition-delay:2.4s}
.go .hw,.go p,.go .cta{opacity:1;transform:none;filter:none}
.big .rv{filter:blur(8px);transition:opacity 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s),transform 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s),filter 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s)}.big .rv.in{filter:none}
.sheet{position:relative;z-index:3;background:var(--cream);border-radius:34px 34px 0 0;margin-top:-50vh;box-shadow:0 -30px 60px rgba(16,42,67,.35)}
.emo.sheet{background:var(--g);margin-top:-34px;box-shadow:0 -24px 50px rgba(16,42,67,.25)}
.idea{position:relative;padding-top:clamp(130px,22vw,240px);padding-bottom:clamp(120px,18vw,200px)}
.fd{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--lime);opacity:.5}.fd.o{width:6px;height:6px;background:var(--c);opacity:.9}
.idea .two{grid-template-columns:1fr!important;margin-top:56px}
.prin{background:var(--g);color:#fff;position:relative;z-index:3}.prin .sh{color:#fff}
.pr{list-style:none;margin:48px 0 0;padding:0}
.pr li{position:relative;display:grid;grid-template-columns:52px 1fr;padding:36px 0}
.pr .ln{position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.28);transform:scaleX(0);transform-origin:left;transition:transform 1.5s cubic-bezier(.2,.8,.2,1)}
.pr li:after{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;border-radius:50%;background:#fff;opacity:0;transition:opacity .6s}
.pr .n{font-weight:600;font-size:14px;color:#ffffff99;padding-top:14px;opacity:0;transition:opacity .8s .2s}
.pr h3{font-size:clamp(30px,6vw,56px);font-weight:700;opacity:0;transform:translateY(16px);transition:opacity 1s cubic-bezier(.2,.8,.2,1) .6s,transform 1s cubic-bezier(.2,.8,.2,1) .6s}
.pr p{grid-column:2;margin:10px 0 0;color:#ffffffbd;font-size:clamp(16px,2vw,20px);opacity:0;transform:translateY(12px);transition:opacity 1s cubic-bezier(.2,.8,.2,1) 1s,transform 1s cubic-bezier(.2,.8,.2,1) 1s}
.pr li.in .ln{transform:none}.pr li.in:after,.pr li.in .n,.pr li.in h3,.pr li.in p{opacity:1;transform:none}
.pf{display:flex;gap:12px;align-items:center;margin-bottom:18px}.uc .pf b{font-size:16px}
.uc li:before{transition:background .6s,border-color .6s}
.bdw{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;border-radius:14px;background:var(--cream);font-weight:600;font-size:14px;opacity:0;transform:translateY(10px) scale(.96);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}.bdw.in{opacity:1;transform:none}
.bar i{transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.fin{position:relative;overflow:hidden;background:var(--g);color:#fff}#cv2{position:absolute;inset:0;width:100%;height:100%}.fin>.rv{position:relative;z-index:2}
.lock{color:#fff}.fin h2{color:#fff;margin:30px 0 14px}.fin p{color:#ffffffbd;font-size:clamp(17px,2.2vw,22px);margin:0 auto 34px;max-width:520px}
.lf{background:var(--g);color:#ffffff99;border-top:1px solid #ffffff1f}.lf a{color:#ffffffb3}

/* ===== v3: connected journey ===== */
.tail{position:relative;z-index:3;background:var(--g);border-radius:34px 34px 0 0;margin-top:-34px;overflow:hidden;box-shadow:0 -24px 50px rgba(16,42,67,.25)}
.emo.sheet{background:none;margin-top:0;box-shadow:none;border-radius:0;z-index:2}.fin{background:none;z-index:2}

#sk{display:inline-block}.tick{animation:tk .8s cubic-bezier(.2,.8,.2,1)}@keyframes tk{from{transform:translateY(12px);opacity:0}}

.evid .cc,.evid .wk{color:var(--g)}.pv{margin-top:70px}.toast{top:-62px}

<body>
<div id="app"><div class="splash"><div style="text-align:center"><div class="spin" style="width:34px;height:34px;margin:0 auto"></div><p style="margin:14px 0 0;font-size:14px;color:#ffffffb3">Checking your session…</p></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== 1. CONFIG — publishable/anon key ONLY. Never put a service-role/secret key here. ===== */
const CFG={url:'https://nkvayvvdgpesneidtwdd.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rdmF5dnZkZ3Blc25laWR0d2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjczNjcsImV4cCI6MjEwNjI0MzM2N30.Z8z248fvNZsec5IQt8hFaGBfnBii5BqT8HFlDYJR5d8',table:'profiles'}; // public anon key (safe for browsers)
const REDIRECT=location.origin+location.pathname; // add this URL to Supabase Auth → URL Configuration → Redirect URLs
const ok=!CFG.url.startsWith('YOUR_');
const sb=ok?supabase.createClient(CFG.url,CFG.key,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;

/* ===== 2. VALIDATION ===== */
const EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const LEVELS=['100','200','300','400','500','600'];
function vAccount(v,confirm=true){const e={};
 if(!EMAIL.test(v.email||''))e.email='Enter a valid email, like ada@school.edu.';
 if(!v.password||v.password.length<8||!/[A-Za-z]/.test(v.password)||!/\d/.test(v.password))e.password='Use at least 8 characters with a letter and a number.';
 if(confirm&&v.confirm!==v.password)e.confirm="Passwords don't match.";return e}
function vProfile(v){const e={};
 const ln=k=>(v[k]||'').trim().length;
 if(ln('full_name')<2)e.full_name='Tell us your full name (at least 2 characters).';
 if(ln('school')<2)e.school='Enter your school (at least 2 characters).';
 if(ln('department')<2)e.department='Enter your department (at least 2 characters).';
 if(!LEVELS.includes(v.level))e.level='Pick your level.';return e}
const complete=p=>!!p&&['full_name','school','department','level'].every(k=>String(p[k]??'').trim());

/* ===== 3. FRIENDLY ERRORS ===== */
function friendly(x){const m=(x&&x.message||'').toLowerCase();
 if(m.includes('invalid login'))return "Your email or password doesn't look right. Please check and try again.";
 if(m.includes('not confirmed'))return 'Please verify your email first. Open the link we sent you, then log in.';
 if(m.includes('already registered')||m.includes('already been registered'))return 'An account with this email already exists. Try logging in instead.';
 if(m.includes('database error saving new user'))return "We couldn't create your account. Please check your name, school, department and level, then try again.";
 if(m.includes('invalid')&&m.includes('email'))return "That email address doesn't look valid.";
 if(m.includes('signups not allowed')||(m.includes('signup')&&m.includes('disabled')))return 'Sign-ups are paused right now. Please try again later.';
 if(m.includes('rate limit')||m.includes('too many')||x?.status===429)return 'Too many attempts. Please wait a minute and try again.';
 if(m.includes('password')&&(m.includes('weak')||m.includes('least')||m.includes('short')))return 'That password is too weak. Use 8+ characters with letters and numbers.';
 if(m.includes('same password'))return 'Choose a password you have not used before.';
 if(m.includes('fetch')||m.includes('network')||!navigator.onLine)return "We can't reach Together right now. Check your connection and try again.";
 if(x?.code==='42501')return "Your account was created, but we couldn't save your profile (permissions). Please contact support.";
 console.error(x);return 'Something went wrong on our side. Please try again.'}

/* ===== 4. STATE + SESSION (Supabase is the only source of truth) ===== */
const S={ready:false,user:null,profile:null,recovery:false,flash:null,email:''};
let rid=0;
async function loadUser(){
 const{data:{session}}=await sb.auth.getSession();S.session=session;
 if(!session){S.user=null;S.profile=null;S.role=null;return}
 const{data,error}=await sb.auth.getUser(); // verified with the Auth server
 if(error||!data.user){S.user=S.profile=S.role=S.session=null;await sb.auth.signOut({scope:'local'});return}
 S.user=data.user;
 const get=()=>Promise.all([sb.from(CFG.table).select('*').eq('id',S.user.id).maybeSingle(),sb.from('user_roles').select('role').eq('user_id',S.user.id).maybeSingle()]);
 let[pr,rl]=await get();
 if(!pr.data&&!pr.error){await new Promise(r=>setTimeout(r,800));[pr,rl]=await get()} // the DB trigger creates the profile at signup
 if(pr.error)console.error(pr.error);S.profile=pr.data||null;S.role=rl.data?rl.data.role:null}
/* Auth layer: single place for auth + profile calls. The profile row is created by the database trigger, never by the frontend. */
const Auth={get status(){return !S.ready?'loading':S.user?'authenticated':'unauthenticated'},
 get state(){return{status:this.status,user:S.user,profile:S.profile,role:S.role,session:S.session}},
 refresh:()=>route(true),
 signUp:v=>sb.auth.signUp({email:v.email.trim(),password:v.password,options:{emailRedirectTo:REDIRECT,data:{full_name:v.full_name.trim(),school:v.school.trim(),department:v.department.trim(),level:v.level}}}),
 signIn:v=>sb.auth.signInWithPassword({email:v.email.trim(),password:v.password}),
 signOut:()=>sb.auth.signOut(),
 async updateProfile(v){ // only the six columns RLS/grants allow; points, streaks and role are never sent
  const row={full_name:v.full_name.trim(),school:v.school.trim(),department:v.department.trim(),level:v.level,bio:(v.bio||'').trim()||null,avatar_path:(v.avatar_path||'').trim()||null};
  const{data,error}=await sb.from(CFG.table).update(row).eq('id',S.user.id).select().single();if(error)throw error;S.profile=data;return data}};
if(ok)sb.auth.onAuthStateChange((ev)=>{
 if(ev==='PASSWORD_RECOVERY'){S.recovery=true;location.hash='#/reset'}
 setTimeout(()=>route(true),0)}); // never await Supabase inside this callback

/* ===== 5. UI HELPERS ===== */
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mark=(h=34,dk=true)=>{const a=dk?'#347B75':'#102A43',b=dk?'#EFECE3':'#102A43';return `<svg width="${h*88/116}" height="${h}" viewBox="0 0 88 116" role="img" aria-label="Together"><circle cx="18.5" cy="17" r="16.7" fill="${a}"/><rect x="1" y="41" width="36" height="73" rx="18" fill="${a}"/><circle cx="69.5" cy="20.5" r="16" fill="${b}"/><rect x="52" y="43" width="35" height="72" rx="17.5" fill="${b}"/></svg>`};const LOGO=mark(34);
const fld=(n,l,t='text',v='',x='')=>`<div class="fld" id="f-${n}"><label for="${n}">${l}</label><div class="inp"><input id="${n}" name="${n}" type="${t}" value="${esc(v)}" ${x}>${t==='password'?'<button type="button" class="eye" data-act="eye" aria-label="Show or hide password">Show</button>':''}</div><div class="msg" id="e-${n}" role="alert"></div></div>`;
const lvl=v=>`<div class="fld" id="f-level"><label for="level">Level</label><select id="level" name="level"><option value="">Choose level</option>${LEVELS.map(l=>`<option value="${l}" ${l===String(v)?'selected':''}>${l} Level</option>`).join('')}</select><div class="msg" id="e-level" role="alert"></div></div>`;
const btn=(t,c='pri')=>`<button class="btn ${c}" type="submit"><span class="t">${t}</span></button>`;
const alertBox=(m,k='e')=>`<div class="alert ${k}" role="alert">${m}</div>`;
function shell(inner,hero){landingStop();app.innerHTML=`<div class="split"><aside class="brand"><div class="logo">${LOGO}Together</div><h1>${hero||'Grow together.<br><em>Achieve together.</em>'}</h1><p class="lead">Plan your journey, track your progress, reach your dreams with students who are doing the same.</p><ul class="perks"><li><i style="background:rgba(255,255,255,.12)">🎯</i>Set goals &amp; complete tasks</li><li><i style="background:rgba(255,255,255,.12)">🔥</i>Build streaks &amp; earn points</li><li><i style="background:rgba(255,255,255,.12)">👥</i>Connect with other students</li><li><i style="background:rgba(255,255,255,.12)">🏆</i>Celebrate achievements</li></ul></aside><main class="main"><div class="card">${inner}</div></main></div>`}
function show(errs){let bad=false;document.querySelectorAll('.fld').forEach(f=>{const n=f.id.slice(2),m=errs[n];f.classList.toggle('bad',!!m);f.querySelector('.msg').textContent=m||'';if(m&&!bad){bad=true;f.querySelector('input,select,textarea').focus()}});return bad}
const vals=f=>Object.fromEntries(new FormData(f).entries());
function busy(f,on,label){f.dataset.busy=on?'1':'';f.querySelectorAll('input,select,textarea,button').forEach(e=>e.disabled=on);const b=f.querySelector('.btn');if(b)b.innerHTML=on?`<span class="spin"></span>${label||'Please wait…'}`:`<span class="t">${b.dataset.l}</span>`}
function formErr(f,m){let a=f.querySelector('.alert');if(!a){f.insertAdjacentHTML('afterbegin',alertBox(m));return}a.className='alert e';a.textContent=m}
const go=h=>{if(location.hash==='#/'+h)route();else location.hash='#/'+h};

/* ===== 6. VIEWS ===== */
const V={
welcome:()=>landing(),
register:()=>shell(`<h2>Create your account</h2><p class="sub">It takes a minute. No photo needed.</p><form data-form="register" novalidate>${fld('email','Email','email','','autocomplete="email" inputmode="email"')}<div class="row" style="grid-template-columns:1fr 1fr">${fld('password','Password','password','','autocomplete="new-password"')}${fld('confirm','Confirm','password','','autocomplete="new-password"')}</div><div class="hint" style="margin:-8px 0 14px">8+ characters, with a letter and a number.</div>${fld('full_name','Full name','text','','autocomplete="name"')}${fld('school','School','text','','autocomplete="organization"')}${fld('department','Department')}${lvl('')}${btn('Create account')}</form><p class="foot">Already in? <a href="#/login">Log in</a></p>`),
'check-email':()=>shell(`<div class="big">📬</div><h2>Check your email</h2><p class="sub">We sent a verification link to <b>${esc(S.email)}</b>. Open it on this device to finish setting up your profile.</p><a class="btn grn" href="#/login" style="text-decoration:none">Back to login</a>`),
login:()=>{const fl=S.flash;S.flash=null;shell(`<h2>Welcome back</h2><p class="sub">Log in to pick up where you left off.</p>${fl?alertBox(esc(fl),'ok'):''}<form data-form="login" novalidate>${fld('email','Email','email','','autocomplete="email" inputmode="email"')}${fld('password','Password','password','','autocomplete="current-password"')}<div style="text-align:right;margin:-6px 0 16px"><a href="#/forgot">Forgot password?</a></div>${btn('Log in')}</form><p class="foot">New here? <a href="#/register">Create an account</a></p>`)},
forgot:()=>shell(`<h2>Reset your password</h2><p class="sub">Enter your email and we'll send you a link to choose a new one.</p><form data-form="forgot" novalidate>${fld('email','Email','email','','autocomplete="email" inputmode="email"')}${btn('Send reset link')}</form><p class="foot"><a href="#/login">Back to login</a></p>`),
reset:()=>shell(`<h2>Choose a new password</h2><p class="sub">Make it one you'll remember.</p><form data-form="reset" novalidate>${fld('password','New password','password','','autocomplete="new-password"')}${fld('confirm','Confirm password','password','','autocomplete="new-password"')}${btn('Save password')}</form>`),
setup:()=>{const p=S.profile;
 if(!complete(p))return shell(`<div class="big">🌱</div><h2>We couldn't load your profile</h2><p class="sub">You're signed in, but your student profile isn't available yet. Please try again in a moment.</p><button class="btn pri" data-act="retry">Try again</button><div style="height:10px"></div><button class="btn ghost" data-act="logout">Log out</button>`);
 S.welcome=false;return shell(`<div class="big">🎉</div><h2>Welcome to Together, ${esc(p.full_name.split(' ')[0])}!</h2><p class="sub">Your student profile is ready.</p><div class="sum"><div><span>Name</span><b>${esc(p.full_name)}</b></div><div><span>School</span><b>${esc(p.school)}</b></div><div><span>Department</span><b>${esc(p.department)}</b></div><div><span>Level</span><b>${esc(p.level)}</b></div></div><a class="btn pri" href="#/home" style="text-decoration:none">Enter Together</a><p class="foot">You can add a bio in Profile.</p>`,'Your goals.<br><em>Our support.</em>')}};
const PAGES={home:['🏠','Home'],tasks:['✅','Tasks'],goals:['🎯','Goals'],community:['👥','Community'],books:['📚','Books'],leaderboard:['🏆','Leaderboard'],profile:['👤','Profile'],settings:['⚙️','Settings']};
function appView(p){landingStop();const pr=S.profile,[ic,name]=PAGES[p];
 const body=p==='home'?`<h1 style="font-size:28px;font-weight:800">Good to see you, ${esc(pr.full_name.split(' ')[0])} 👋</h1><div class="chips"><span class="chip" style="background:#dfeae7;color:var(--g)">⭐ ${pr.points??0} points</span><span class="chip" style="background:#fdeee2;color:#a5561f">🔥 ${pr.current_streak??0} day streak</span></div><div class="tiles">${Object.entries(PAGES).filter(([k])=>k!=='home').map(([k,[i,n]])=>`<a class="tile" href="#/${k}"><span>${i}</span>${n}</a>`).join('')}</div>`
 :`<h1 style="font-size:28px;font-weight:800">${ic} ${name}</h1><p class="sub" style="margin-top:8px">${p==='profile'?`${esc(pr.full_name)} · ${esc(pr.department)}, ${esc(pr.level)} Level · ${esc(pr.school)}<br>Photo and bio are coming soon.`:p==='settings'?'Signed in as '+esc(S.user.email)+' · role: '+esc(S.role||'student')+'.':'This space is coming soon.'}</p>${p==='settings'?'<button class="btn grn" style="max-width:240px" data-act="logout">Log out</button>':''}`;
 const nav=['home','tasks','goals','community','profile'].map(k=>`<a href="#/${k}" class="${k===p?'on':''}"><span>${PAGES[k][0]}</span>${PAGES[k][1]}</a>`).join('');
 app.innerHTML=`<header class="top"><div class="logo" style="font-size:20px">${mark(26)}Together</div><button data-act="logout">Log out</button></header><div class="page">${body}</div><nav class="nav">${nav}</nav>`;if(p==='profile')$('.page').innerHTML=profileHtml(pr)}
const profileHtml=pr=>`<h1 style="font-size:28px;font-weight:800">👤 Profile</h1><div class="chips"><span class="chip" style="background:#dfeae7;color:var(--g)">⭐ ${pr.points} points</span><span class="chip" style="background:#fdeee2;color:#a5561f">🔥 ${pr.current_streak} day streak · best ${pr.longest_streak}</span><span class="chip" style="background:#fff;border:1px solid var(--line)">${esc(S.role||'student')}</span></div><form data-form="profile" novalidate style="max-width:460px">${fld('full_name','Full name','text',pr.full_name)}${fld('school','School','text',pr.school)}${fld('department','Department','text',pr.department)}${lvl(pr.level)}<div class="fld" id="f-bio"><label for="bio">Bio</label><textarea id="bio" name="bio" maxlength="300" placeholder="A line about you and what you're working toward">${esc(pr.bio||'')}</textarea><div class="msg" id="e-bio"></div></div>${fld('avatar_path','Avatar reference (optional)','text',pr.avatar_path||'')}${btn('Save profile','grn')}</form>`

/* ===== 7. ROUTER + PROTECTED ROUTES ===== */
const PUB=['welcome','login','register','forgot','check-email'];
async function route(force){
 if(!ok){app.innerHTML='<div class="main"><div class="card"><h2>Connect Supabase</h2><p class="sub">Open index.html and set <b>CFG.url</b> and <b>CFG.key</b> (publishable/anon key) at the top of the script.</p></div></div>';return}
 const id=++rid;
 if(force||!S.ready){await loadUser();if(id!==rid)return}
 S.ready=true;
 const p=(location.hash.replace(/^#\/?/,'')||'').split('?')[0];
 if(p==='reset'){if(!S.user&&!S.recovery)return go('login');return V.reset()}
 if(!S.user){if(!PUB.includes(p))return go('welcome');return V[p]()}
 const done=complete(S.profile);
 if(PUB.includes(p)||!p)return go(done&&!S.welcome?'home':'setup');
 if(p==='setup')return V.setup();
 if(!done)return go('setup');
 if(!PAGES[p])return go('home');
 appView(p)}
window.addEventListener('hashchange',()=>route());

/* ===== 8. ACTIONS ===== */
const H={
async register(f,v){const e={...vAccount(v),...vProfile(v)};if(show(e))return;busy(f,1,'Creating account…');
 try{const{data,error}=await Auth.signUp(v); // metadata is read by the database trigger that creates the profile
  if(error)throw error;
  if(data.user&&data.user.identities&&!data.user.identities.length)throw{message:'User already registered'};
  if(data.session){S.welcome=true;route(true)}else{S.email=v.email.trim();go('check-email')}}
 catch(x){busy(f,0);formErr(f,friendly(x))}},
async login(f,v){const e=vAccount(v,false);if(!v.password)e.password='Enter your password.';if(e.password&&v.password)delete e.password;if(show(e))return;busy(f,1,'Logging in…');
 const{error}=await Auth.signIn(v).catch(x=>({error:x}));
 if(error){busy(f,0);formErr(f,friendly(error))} /* success → onAuthStateChange → router */},
async forgot(f,v){if(show(vAccount(v,false).email?{email:vAccount(v,false).email}:{}))return;busy(f,1,'Sending…');
 const{error}=await sb.auth.resetPasswordForEmail(v.email.trim(),{redirectTo:REDIRECT}).catch(x=>({error:x}));busy(f,0);
 if(error&&!/not found/i.test(error.message||''))return formErr(f,friendly(error));
 f.outerHTML=`<div class="big">📬</div>${alertBox('If an account exists for <b>'+esc(v.email)+'</b>, a reset link is on its way. It can take a couple of minutes.','ok')}<a class="btn grn" href="#/login" style="text-decoration:none">Back to login</a>`},
async reset(f,v){const e=vAccount({email:'a@b.co',...v});delete e.email;if(show(e))return;busy(f,1,'Saving…');
